name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked environment
        run: uv sync --extra dev --frozen
      - name: Run core tests
        run: uv run python -m pytest -q
      - name: Audit public release contents
        run: uv run python -m nostos.release --project-root . --output dist/release-audit
